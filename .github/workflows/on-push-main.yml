on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup typst
        uses: typst-community/setup-typst@v5.3
        with:
          typst-version: 0.15.1
      - name: Make
        run: |
          make all
